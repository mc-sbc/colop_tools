<!DOCTYPE html>
<html>
  <head>
    <title>Timetable Viewer</title>
    
    <!-- iOS Icon & Settings -->
    <link rel="apple-touch-icon" sizes="180x180" href="ttv_logo_ios.png">
    <meta name="apple-mobile-web-app-title" content="TT Viewer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Smart Redirect Script -->
    <script>
      // Check if the user is launching this from their Home Screen
      if (window.navigator.standalone === true) {
        // Yes! Redirect them to the actual tool.
        window.location.replace("https://script.google.com/a/macros/stbedes.catholic.edu.au/s/AKfycbzQgw4GR4gbrNiEQipXU0RtJyWWYcq749zCq_0FayyP-4HLEOBqe_IC8sXGigLqnIM/exec");
      }
    </script>

    <style>
      body { 
        background-color: #F1F3F5; 
        font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        text-align: center; 
        padding-top: 60px; 
      }
      .install-card { 
        background: white; 
        padding: 30px 20px; 
        border-radius: 16px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        max-width: 300px; 
        margin: 0 auto; 
      }
      img { 
        width: 90px; 
        border-radius: 18px; 
        margin-bottom: 20px; 
      }
    </style>
  </head>
  <body>
    
    <!-- This only shows in Safari, never on the Home Screen app -->
    <div class="install-card">
      <img src="ttv_logo_ios.png" alt="Timetable Icon">
      <h3>Install Timetable</h3>
      <p style="color: #555; line-height: 1.5; font-size: 15px;">
        Tap the <b>Share</b> button at the bottom of your screen and select <br><b>Add to Home Screen</b>.
      </p>
    </div>

  </body>
</html>
